name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to release (must exist)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # `github.ref_name` is the DEFAULT BRANCH on a manual dispatch, so
          # the tag input has to drive the checkout in that case.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # This plugin is built (TypeScript + sass): `npm run pack` runs the
      # production build and writes `plugin.zip` (flat: main.js, style.css,
      # manifest.json) at the repo root — the asset the installer expects.
      #
      # `continue-on-error`: historical tags (0.3.x … 0.4.x) are released from
      # their own old trees, whose typecheck/tests were not written against
      # today's dependencies. Producing the package matters more than the
      # gate, so a red verify only warns.
      - name: Verify
        continue-on-error: true
        run: |
          npm run typecheck
          npm run test

      - name: Pack plugin.zip
        run: npm run pack

      # Release notes come from CHANGELOG.md, not from `git log`: the section
      # under `## <version>` (bilingual `###` entries) is copied verbatim.
      #
      # The checkout `ref` is the tag itself, so this always reads the
      # CHANGELOG.md of the version being released.
      #
      # Strict by design (matches the rule stated at the top of CHANGELOG.md):
      # no file, no matching section, or an empty section -> fail the build.
      # Known trade-off: the historical tags 0.3.0–0.4.4 were released from
      # trees without a CHANGELOG.md, so re-running this workflow for them
      # now fails. Past releases are considered frozen — do not re-run them.
      - name: Generate release body
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ver="$TAG"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing. Release notes must come from it."
            exit 1
          fi
          # A section starts at the "## <ver>" heading (also accepts the
          # "## [ver]" / "## vver" spellings) and ends at the next "## "
          # heading or EOF. The version is compared as plain text, so the
          # dots in "0.4.6" need no regex escaping; `\r` is stripped first
          # because the file may carry CRLF line endings.
          awk -v ver="$ver" '
            { line = $0; sub(/\r$/, "", line) }
            line ~ /^##[[:space:]]/ {
              if (in_section) exit
              v = line
              sub(/^##[[:space:]]+/, "", v)
              gsub(/[][]/, "", v)
              sub(/^v/, "", v)
              split(v, a, /[[:space:]]/)
              if (a[1] == ver) in_section = 1
              next
            }
            in_section { print line }
          ' CHANGELOG.md | sed -e '/./,$!d' -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' > release_body.md
          if [ ! -s release_body.md ]; then
            echo "::error::CHANGELOG.md has no [$ver] section. Add '## $ver' with ### entries before tagging."
            exit 1
          fi
          cat release_body.md

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: >
          gh release create "$TAG"
          --title "$TAG"
          --notes-file release_body.md
          --verify-tag
          plugin.zip
